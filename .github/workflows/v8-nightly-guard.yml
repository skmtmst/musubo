name: V8 nightly guard

on:
  schedule:
    - cron: '0 17 * * *' # 日本時間 02:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8-nightly-guard
  cancel-in-progress: false

jobs:
  v8-screen-guard:
    name: V8 screen guard
    runs-on: ubuntu-latest
    # Check the current V8 screens at 1152, 1440 and 1920.
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8788
      NEXT_PUBLIC_RESTAURANT_TEST_ENABLED: 'true'
      NEXT_PUBLIC_GOOGLE_BUSINESS_ENABLED: 'true'
      V8_SPEED_ENFORCEMENT: ${{ vars.V8_SPEED_ENFORCEMENT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether to run the screen guard
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "compare=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "compare=true" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
            | grep -qE '^(apps/web/|packages/shared/|scripts/visual-qa/|pnpm-lock\.yaml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.scope.outputs.run == 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '22.23.4'
          cache: pnpm
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the right-panel fixtures with the conversation AI entry
        if: steps.scope.outputs.run == 'true'
        env:
          NEXT_PUBLIC_CONVERSATION_AI_ENABLED: 'true'
        run: |
          pnpm --filter @line-harness/update-engine build
          pnpm --filter web build
          cp -a apps/web/out /tmp/detail-out
      - name: Build the PR admin against the visual-qa mock API
        if: steps.scope.outputs.run == 'true'
        run: |
          pnpm --filter @line-harness/update-engine build
          pnpm --filter web build
          cp -a apps/web/out /tmp/head-out
      - name: Build the base admin against the same mock API
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.compare == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add /tmp/base "$BASE_SHA"
          cd /tmp/base
          pnpm install --frozen-lockfile
          pnpm --filter @line-harness/update-engine build
          pnpm --filter web build
      - name: Install Chromium for the V8 screen guard
        if: steps.scope.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Start the mock API and serve the built admin
        if: steps.scope.outputs.run == 'true'
        run: |
          node scripts/visual-qa/mock-api.mjs > /tmp/mock-api.log 2>&1 &
          node apps/web/scripts/v8-guard/serve-out.mjs /tmp/head-out 4310 > /tmp/serve-head.log 2>&1 &
          if [ "${{ steps.scope.outputs.compare }}" = "true" ]; then
            node apps/web/scripts/v8-guard/serve-out.mjs /tmp/base/apps/web/out 4311 > /tmp/serve-base.log 2>&1 &
          fi
          ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4310/friends > /dev/null \
              && curl -sf 'http://127.0.0.1:8788/api/friends?account_id=visual-qa-account' > /dev/null \
              && { [ "${{ steps.scope.outputs.compare }}" != "true" ] || curl -sf http://127.0.0.1:4311/friends > /dev/null; }; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            cat /tmp/mock-api.log /tmp/serve-head.log
            echo "::error::速度・画面検査のサーバーが起動しませんでした"
            exit 1
          fi
      - name: No permission copy flashes during navigation
        if: steps.scope.outputs.run == 'true'
        env:
          V8_GUARD_BASE: http://127.0.0.1:4310
          V8_GUARD_ARTIFACT_DIR: /tmp/v8-guard/permission-navigation
        run: node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/permission-flash.test.mjs apps/web/scripts/v8-guard/permission-navigation.test.mjs
      - name: No V8 layout breaks at 1152, 1440 and 1920
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/layout-overflow.mjs http://127.0.0.1:4310 /tmp/v8-guard/layout.json
      # 空白量は診断のみ。切れ・重なり・操作の遮断を必須で確認する。
      - name: Broken fixtures must fail the V8 layout guard
        if: steps.scope.outputs.run == 'true'
        env:
          V8_GUARD_BASE: http://127.0.0.1:4310
          V8_GUARD_DETAIL_OUT: /tmp/detail-out
        run: |
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/layout-defects.test.mjs apps/web/scripts/v8-guard/create-footer-choices.test.mjs apps/web/scripts/v8-guard/shared-recipe-defaults.test.mjs apps/web/scripts/v8-guard/affixed-input-layout.test.mjs apps/web/scripts/v8-guard/list-toolbar-readable.test.mjs apps/web/scripts/v8-guard/action-row-narrow.test.mjs apps/web/scripts/v8-guard/button-content-width.test.mjs apps/web/scripts/v8-guard/control-feedback.test.mjs apps/web/scripts/v8-guard/window-focus-clip.test.mjs apps/web/scripts/v8-guard/automation-field-error.test.mjs apps/web/scripts/v8-guard/fix-patterns.test.mjs apps/web/scripts/v8-guard/owner-rules.test.mjs apps/web/scripts/v8-guard/pendec2-rules.test.mjs apps/web/scripts/v8-guard/shared-surface-layout.test.mjs apps/web/scripts/v8-guard/b244-rules.test.mjs apps/web/scripts/v8-guard/dialog-layout.test.mjs apps/web/scripts/v8-guard/table-column-alignment.test.mjs apps/web/scripts/v8-guard/visual-state.test.mjs apps/web/scripts/v8-guard/bar-chart-layout.test.mjs apps/web/scripts/v8-guard/reservation-reading.test.mjs apps/web/scripts/v8-guard/input-retention.test.mjs apps/web/scripts/v8-guard/record-columns.test.mjs apps/web/scripts/v8-guard/drawer-layout.test.mjs apps/web/scripts/v8-guard/layout-overflow.test.mjs apps/web/scripts/v8-guard/form-rules.test.mjs apps/web/scripts/v8-guard/active-modal-audit.test.mjs apps/web/scripts/v8-guard/edge-inset.test.mjs apps/web/scripts/v8-guard/inbox-filter-layout.test.mjs apps/web/scripts/v8-guard/scenarios-list-layout.test.mjs apps/web/scripts/v8-guard/salon-filters-row.test.mjs apps/web/scripts/v8-guard/list-name-open.test.mjs apps/web/scripts/v8-guard/ui-layout-alignment.test.mjs apps/web/scripts/v8-guard/ui-layout-tabrow.test.mjs
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/viewport-footer.test.mjs
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/heading-band.test.mjs apps/web/scripts/v8-guard/store-heading.test.mjs apps/web/scripts/v8-guard/dashboard-content.test.mjs apps/web/scripts/v8-guard/home-pending-heading.test.mjs apps/web/scripts/v8-guard/document-title.test.mjs apps/web/scripts/v8-guard/canonical-route.test.mjs apps/web/scripts/v8-guard/dialog-footer.test.mjs apps/web/scripts/v8-guard/dialog-leading.test.mjs apps/web/scripts/v8-guard/patrol-layout.test.mjs apps/web/scripts/v8-guard/scheduled-message.test.mjs apps/web/scripts/v8-guard/route-pending.test.mjs apps/web/scripts/v8-guard/style-switcher.test.mjs apps/web/scripts/v8-guard/monthly-flow.test.mjs
      - name: Sidebar, booking and pagination details stay as designed
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/nav-detail.test.mjs apps/web/scripts/v8-guard/booking-dialog-layout.test.mjs apps/web/scripts/v8-guard/booking-title.test.mjs
      - name: Narrow preview opens once and preserves form input
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/narrow-preview.test.mjs
      - name: Train 17 waitlist failure and inflow mouse regressions
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/stgfix17-browser.mjs http://127.0.0.1:4310 /tmp/v8-guard/stgfix17
      - name: Booking preview date agrees through settings and preview tabs
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/stgfix18-preview.mjs http://127.0.0.1:4310 /tmp/v8-guard/stgfix18-preview
      - name: No new V8 layout or owner-rule defects
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/layout-defects.mjs http://127.0.0.1:4310 /tmp/v8-guard/defects.json --compare-url '${{ steps.scope.outputs.compare == 'true' && 'http://127.0.0.1:4311' || '' }}'
      - name: Store comparison delta labels stay inside their values
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 apps/web/scripts/v8-guard/store-compare-layout.test.mjs
      - name: Inventory edge insets, folder dots and page actions on all admin screens
        if: steps.scope.outputs.run == 'true'
        run: node apps/web/scripts/v8-guard/presentation-audit.mjs http://127.0.0.1:4310 /tmp/v8-guard/presentation --compare-url '${{ steps.scope.outputs.compare == 'true' && 'http://127.0.0.1:4311' || '' }}'
      - name: List row rules
        if: steps.scope.outputs.run == 'true'
        run: |
          node apps/web/scripts/list-row-audit.mjs
          node apps/web/scripts/v8-guard/list-row-audit.mjs http://127.0.0.1:4310 /tmp/v8-guard/list-rows.json
          node apps/web/scripts/v8-guard/list-skeleton-audit.mjs http://127.0.0.1:4310 /tmp/v8-guard/list-skeleton.json
      - name: Speed measurement and reference policy controls
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node --test apps/web/scripts/v8-guard/mock-local.test.mjs apps/web/scripts/v8-guard/speed-budget.test.mjs apps/web/scripts/v8-guard/speed-check.test.mjs apps/web/scripts/v8-guard/perf3-targets.test.mjs apps/web/scripts/v8-guard/stgfix17-targets.test.mjs
      - name: Common V8 speed checks (11 scenes, five medians)
        id: speed_budget
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          V8_SPEED_PROFILE: ci
        run: pnpm qa:speed http://127.0.0.1:4310 /tmp/v8-guard/speed.json
      - name: Train 17 absolute targets
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node apps/web/scripts/v8-guard/stgfix17-targets.mjs /tmp/v8-guard/speed.json
      - name: 2000 friends meet absolute speed targets
        id: stress_speed
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          V8_SPEED_PROFILE: ci
        run: node apps/web/scripts/v8-guard/stress-targets.mjs /tmp/v8-guard/speed.json
      - name: PERF-01 fixed list speed targets
        id: perf3_targets
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        run: node apps/web/scripts/v8-guard/perf3-targets.mjs /tmp/v8-guard/speed.json
      - name: Report speed reference results (including incomplete measurements)
        if: ${{ !cancelled() && steps.scope.outputs.run == 'true' }}
        env:
          SPEED_BUDGET_OUTCOME: ${{ steps.speed_budget.outcome }}
          STRESS_SPEED_OUTCOME: ${{ steps.stress_speed.outcome }}
          PERF3_TARGETS_OUTCOME: ${{ steps.perf3_targets.outcome }}
        run: node apps/web/scripts/v8-guard/speed-report.mjs /tmp/v8-guard/speed.json
      - name: Virtual table selection, keyboard and layout
        if: steps.scope.outputs.run == 'true'
        run: |
          node apps/web/scripts/v8-guard/browser-host.mjs --test --test-concurrency=1 scripts/visual-qa/friends-table-state.test.mjs
          node scripts/visual-qa/friends-table.browser.mjs http://127.0.0.1:4310 /tmp/v8-guard/stress-table
      - name: Upload V8 screen guard results
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-screen-guard
          path: |
            /tmp/v8-guard/
            /tmp/mock-api.log
            /tmp/serve-head.log
            /tmp/serve-base.log
          retention-days: 7

      - name: Upload separate speed diagnosis traces
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-speed-diagnosis
          path: /tmp/v8-guard/speed.json.diagnosis/
          if-no-files-found: ignore
          retention-days: 7
