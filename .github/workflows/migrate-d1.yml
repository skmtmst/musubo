name: Migrate D1

# 手で走らせる D1 のマイグレーション。
#
# 本番の適用は承認付き deploy-cloudflare-production.yml の子だけが行う。
# ここは、その前に検証環境（nen-line-stg）で先に試すための入口。
# 検証用のデプロイスクリプト（scripts/deploy/staging-deploy.sh）は
# マイグレーションを当てないので、これが無いと本番が初見になる。
#
# 既定は dry-run。実際に当てるには mode を apply にする。
# 手が滑って走らせても、何も変わらないようにしている。
#
# 当てる前に必ず Time Travel のブックマークを取る。追加のみのポリシーで
# down マイグレーションを書けないので、戻る手段はこれだけになる。

on:
  workflow_dispatch:
    inputs:
      operation:
        description: マイグレーション確認か、ステージング運用経路の確認か
        type: choice
        required: true
        default: migrate
        options:
          - migrate
          - verify-operational-path
          - verify-instagram-cross-post
          - verify-restaurant-delivery
          - restore-booking-hours-20260922
      environment:
        description: どのデータベースに当てるか
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      mode:
        description: dry-run は当てずに一覧するだけ
        type: choice
        required: true
        default: dry-run
        options:
          - dry-run
          - apply
      migration:
        description: 指定した1件だけを対象にする場合のファイル名（空欄は未適用すべて）
        type: string
        required: false
        default: ''
      recovery_digest:
        description: 営業時間復旧専用。dry-run の照合値を apply に指定
        type: string
        required: false
        default: ''
      recovery_confirmation:
        description: 営業時間復旧専用。apply は RESTORE-20260922-TEST-HOURS と入力
        type: string
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ inputs.environment == 'production' && 'cloudflare-production' || 'cloudflare-staging' }}
  queue: max
  cancel-in-progress: false

jobs:
  restore-booking-hours-20260922:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'restore-booking-hours-20260922' &&
      inputs.environment == 'staging' &&
      github.repository == 'skmtmst/line-harness-oss' &&
      github.ref == 'refs/heads/codex/development'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: recovery-staging-booking-hours-20260922
      cancel-in-progress: false
    env:
      RECOVERY_ENVIRONMENT: staging
      RECOVERY_MODE: ${{ inputs.mode }}
      RECOVERY_DIGEST: ${{ inputs.recovery_digest }}
      RECOVERY_CONFIRMATION: ${{ inputs.recovery_confirmation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify offline safety tests
        run: pnpm exec vitest run scripts/recovery/booking-hours-20260922.test.ts
      - name: Verify clean checkout and current development revision
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          recovery_remote_sha=$(git ls-remote origin refs/heads/codex/development | cut -f1)
          test "$recovery_remote_sha" = "$GITHUB_SHA"
      - name: Read-only preflight and backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECOVERY_BACKUP: ${{ runner.temp }}/booking-hours-20260922-before.json
        run: pnpm exec tsx scripts/recovery/booking-hours-20260922.ts capture
      - name: Persist backup before any write
        id: backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: booking-hours-20260922-before-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/booking-hours-20260922-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Restore only the approved interval and flag
        if: inputs.mode == 'apply'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          RECOVERY_ARTIFACT_ID: ${{ steps.backup.outputs.artifact-id }}
          RECOVERY_BACKUP: ${{ runner.temp }}/booking-hours-20260922-before.json
        run: |
          test -z "$(git status --porcelain)"
          recovery_remote_sha=$(git ls-remote origin refs/heads/codex/development | cut -f1)
          test "$recovery_remote_sha" = "$GITHUB_SHA"
          pnpm exec tsx scripts/recovery/booking-hours-20260922.ts apply

  migrate:
    # Staging writes use the latest integrated development SHA. Standalone production stays read-only.
    if: >-
      github.repository == 'skmtmst/musubo' && inputs.operation == 'migrate' &&
      ((inputs.environment == 'staging' && github.ref == 'refs/heads/codex/development') ||
       (inputs.environment == 'production' && inputs.mode == 'dry-run' && github.ref == 'refs/heads/main'))
    concurrency:
      group: ${{ inputs.environment == 'production' && 'migrate-d1-cloudflare-production-readonly' || 'migrate-d1-staging-only' }}
      cancel-in-progress: false
    environment:
      name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require the dedicated staging D1 Write token
        if: inputs.environment == 'staging'
        env:
          CF_D1_WRITE_TOKEN: ${{ secrets.CF_D1_WRITE_TOKEN }}
        run: |
          if [ -z "$CF_D1_WRITE_TOKEN" ]; then
            echo "::error::staging environment secret CF_D1_WRITE_TOKEN が設定されていません"
            exit 1
          fi
          # Use the migration-only credential for every subsequent D1 operation.
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CF_D1_WRITE_TOKEN" >> "$GITHUB_ENV"

      - name: Require an explicitly named staging migration
        env:
          TARGET_MIGRATION: ${{ inputs.migration }}
        run: |
          test -n "$TARGET_MIGRATION" || { echo "::error::検証DBは対象ファイルを1件指定してください"; exit 1; }

      - name: Acquire the shared staging lock
        id: staging_lock
        if: inputs.mode == 'apply'
        run: |
          git config user.name "NEN staging delivery"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm deploy:lock acquire staging \
            --note "D1 migration ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            --remote origin
          pnpm deploy:lock verify staging --sha "$GITHUB_SHA" --remote origin

      - name: Verify latest source and published ancestry before DB write
        if: inputs.mode == 'apply'
        env:
          DELIVERY_TARGET: all
        run: node scripts/deploy/verify-staging-forward.mjs

      # データベース名の決め方。
      #
      # 本番は秘密情報から取る（fork ごとに名前が違う）。
      # 検証は秘密情報があればそれ、無ければ wrangler.staging.toml から読む。
      # 検証用の名前をわざわざ秘密にする理由は無いので、設定を減らしている。
      - name: Resolve the database name
        id: db
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          D1_DATABASE_NAME: ${{ secrets.D1_DATABASE_NAME }}
          D1_STAGING_DATABASE_NAME: ${{ secrets.D1_STAGING_DATABASE_NAME }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            name="$D1_DATABASE_NAME"
            if [ -z "$name" ]; then
              echo "::error::secrets.D1_DATABASE_NAME が設定されていません"
              exit 1
            fi
          else
            name="$D1_STAGING_DATABASE_NAME"
            if [ -z "$name" ]; then
              name=$(grep -A4 'd1_databases' apps/worker/wrangler.staging.toml \
                | grep 'database_name' | head -1 | sed 's/.*= *"//; s/".*//')
            fi
            if [ -z "$name" ]; then
              echo "::error::検証用のデータベース名を決められませんでした"
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "データベースの選択: PASS"

      - name: Check the credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      # まだ当たっていないファイルを数える。dry-run はここで終わる。
      - name: List the pending migrations
        id: pending
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
          TARGET_MIGRATION: ${{ inputs.migration }}
        run: |
          all_pending_file="$RUNNER_TEMP/d1-all-pending-migrations.txt"
          apply_file="$RUNNER_TEMP/d1-pending-migrations.txt"
          : > "$all_pending_file"
          : > "$apply_file"

          if [ -n "$TARGET_MIGRATION" ]; then
            if ! printf '%s' "$TARGET_MIGRATION" | grep -Eq '^[0-9]{3,}_[A-Za-z0-9_-]+\.sql$'; then
              echo "::error::migration にはマイグレーションのファイル名だけを指定してください"
              exit 1
            fi
            if [ ! -f "packages/db/migrations/$TARGET_MIGRATION" ]; then
              echo "::error::指定したマイグレーションが見つかりません: $TARGET_MIGRATION"
              exit 1
            fi
          fi

          # dry-run は SELECT のみ。台帳が無くても作成しない。
          node scripts/deploy/d1-pending-readonly.mjs "$DB_NAME" > "$RUNNER_TEMP/d1-status.json"
          pending_count=$(node -p "require('$RUNNER_TEMP/d1-status.json').count")
          node -e '
            const status = require(process.argv[1]);
            for (const name of status.pending) console.log(`packages/db/migrations/${name}`);
          ' "$RUNNER_TEMP/d1-status.json" > "$all_pending_file"
          echo "COUNT: $pending_count"

          if [ -n "$TARGET_MIGRATION" ]; then
            target_path="packages/db/migrations/$TARGET_MIGRATION"
            if grep -qxF "$target_path" "$all_pending_file"; then
              printf '%s\n' "$target_path" > "$apply_file"
            fi
          else
            cp "$all_pending_file" "$apply_file"
          fi

          apply_count=$(wc -l < "$apply_file" | tr -d ' ')
          if [ -n "$TARGET_MIGRATION" ]; then
            first_pending=$(head -n 1 "$all_pending_file")
            if [ "$target_path" != "$first_pending" ]; then
              echo "::error::最初の未適用マイグレーションだけを指定してください: $first_pending"
              exit 1
            fi
          fi
          echo "count=$apply_count" >> "$GITHUB_OUTPUT"
          echo "total_count=$pending_count" >> "$GITHUB_OUTPUT"
          echo "未適用の総数: ${pending_count} 件 / 今回の対象: ${apply_count} 件"
          {
            echo "## 未適用のマイグレーション: ${pending_count} 件"
            echo
            echo "データベースの選択: PASS"
            echo
            if [ "$pending_count" -gt 0 ]; then
              echo '```'
              sed 's#^packages/db/migrations/##' "$all_pending_file"
              echo '```'
            else
              echo "すべて適用済みです。"
            fi
            echo
            if [ -n "$TARGET_MIGRATION" ]; then
              echo "今回の指定: \`$TARGET_MIGRATION\`"
              echo "適用対象: ${apply_count} 件"
            else
              echo "今回の指定: 未適用すべて"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # 当てる前の復元点。down マイグレーションが書けない以上、
      # 戻る手段はこれだけ。取れなかったら止める。
      - name: Take a Time Travel bookmark
        if: inputs.mode == 'apply' && steps.pending.outputs.count != '0'
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          raw=$(npx wrangler d1 time-travel info "$DB_NAME" --json)
          echo "$raw"

          bookmark=$(printf '%s' "$raw" | node -e "
            const text = require('fs').readFileSync('/dev/stdin', 'utf8');
            let found = '';
            try {
              const d = JSON.parse(text);
              found = d.bookmark ?? d.result?.bookmark ?? '';
            } catch {
              // wrangler が JSON 以外を混ぜることがあるので、拾えなければ次へ
            }
            if (!found) {
              const m = text.match(/[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{8}-[0-9a-f]{32}/i);
              found = m ? m[0] : '';
            }
            process.stdout.write(found);
          ")

          if [ -z "$bookmark" ]; then
            echo "::error::Time Travel のブックマークを取れませんでした。戻る先が無いので中止します。"
            exit 1
          fi

          {
            echo
            echo "## 復元点（Time Travel）"
            echo
            echo "戻すとき:"
            echo
            echo '```bash'
            echo "npx wrangler d1 time-travel restore $DB_NAME --bookmark=$bookmark"
            echo '```'
            echo
            echo "この時点まで巻き戻すので、当てたあとに入った友だち・"
            echo "メッセージ・予約も一緒に消えます。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply the pending migrations
        id: apply
        if: inputs.mode == 'apply' && steps.pending.outputs.count != '0'
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
        run: |
          # 初期化はapplyだけ。復元点を取ってから書き込みを始める。
          npx wrangler d1 execute "$DB_NAME" --remote --command \
            "CREATE TABLE IF NOT EXISTS _migrations (name TEXT PRIMARY KEY, applied_at TEXT NOT NULL)"
          bash scripts/deploy/apply-d1-migrations.sh \
            "$DB_NAME" "$RUNNER_TEMP/d1-pending-migrations.txt"

      - name: Verify the migration is no longer pending
        if: inputs.mode == 'apply' && steps.pending.outputs.count != '0' && steps.apply.outcome == 'success'
        env:
          DB_NAME: ${{ steps.db.outputs.name }}
          TARGET_MIGRATION: ${{ inputs.migration }}
        run: |
          node scripts/deploy/d1-pending-readonly.mjs "$DB_NAME" > "$RUNNER_TEMP/d1-after.json"
          node -e '
            const before = require(process.argv[1]);
            const after = require(process.argv[2]);
            const target = process.argv[3];
            if (before.pending[0] !== target ||
                after.count !== before.count - 1 ||
                JSON.stringify(after.pending) !== JSON.stringify(before.pending.slice(1))) {
              console.error(`Expected only ${target} to be applied`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/d1-status.json" "$RUNNER_TEMP/d1-after.json" "$TARGET_MIGRATION"

      - name: Say what happened
        if: always()
        env:
          MODE: ${{ inputs.mode }}
          COUNT: ${{ steps.pending.outputs.count }}
          TOTAL_COUNT: ${{ steps.pending.outputs.total_count }}
        run: |
          if [ -z "$TOTAL_COUNT" ]; then
            echo "未適用件数は取得できませんでした。0件とは判断できません。"
            exit 1
          fi
          echo "未適用の総数: $TOTAL_COUNT 件 / 今回の対象: $COUNT 件"
          if [ "$MODE" != "apply" ]; then
            echo "dry-run です。何も当てていません。"
            echo "実際に当てるには mode を apply にして、もう一度実行してください。"
          elif [ "${COUNT:-0}" = "0" ]; then
            echo "未適用のものはありませんでした。"
          elif [ "${{ steps.apply.outcome }}" != "success" ]; then
            echo "マイグレーションは途中で停止しました。サマリーの停止位置と確認手順を見てください。"
          else
            echo "$COUNT 件を当てました。上のサマリーに復元点が出ています。"
          fi

      - name: Release the shared staging lock
        if: always() && steps.staging_lock.outcome == 'success'
        run: pnpm deploy:lock release staging --remote origin

  verify-operational-path:
    if: github.repository == 'skmtmst/line-harness-oss' && inputs.operation == 'verify-operational-path' && inputs.environment == 'staging' && github.ref == 'refs/heads/codex/development'
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERIFY_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify D1, delivery batches, and notification rules
        run: |
          set -o pipefail
          pnpm tsx scripts/verification/verify-staging-operational-path.ts \
            | tee "$RUNNER_TEMP/staging-verification.json"

      - name: Publish aggregate-only result
        if: always()
        run: |
          {
            echo '## ステージング運用経路の確認'
            echo
            if [ -s "$RUNNER_TEMP/staging-verification.json" ]; then
              echo '```json'
              tail -n 1 "$RUNNER_TEMP/staging-verification.json"
              echo '```'
            else
              echo '検証結果を生成できませんでした。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Instagram 同時投稿の確認。ログインが必要な画面の中身を読むので、
  # 手元に秘密値を置かず、staging の資格情報を持つここで走らせる。
  # 読むだけで、作って消すのは自分用の管理セッション1行だけ。
  verify-instagram-cross-post:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'verify-instagram-cross-post' &&
      inputs.environment == 'staging' &&
      github.repository == 'skmtmst/line-harness-oss' &&
      github.ref == 'refs/heads/codex/development'
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: verify-staging-instagram-cross-post
      cancel-in-progress: false
    env:
      VERIFY_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify the Instagram cross-post state, posts, and reviews
        run: |
          set -o pipefail
          pnpm tsx scripts/verification/verify-staging-instagram-cross-post.ts \
            | tee "$RUNNER_TEMP/instagram-verification.json"

      - name: Publish aggregate-only result
        if: always()
        run: |
          {
            echo '## Instagram 同時投稿の確認（検証環境）'
            echo
            if [ -s "$RUNNER_TEMP/instagram-verification.json" ]; then
              echo '```json'
              tail -n 1 "$RUNNER_TEMP/instagram-verification.json"
              echo '```'
            else
              echo '検証結果を生成できませんでした。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # デリバリー受注（承認版v02）の確認。未認証では注文一覧・注文履歴・品切れ一括の
  # 3画面とも /login へ移るので、実表示を確かめるにはログイン済みの状態が要る。
  # 手元に秘密値を置かず、staging の資格情報を持つここで走らせる。
  # 読むだけで、作って消すのは自分用の管理セッション1行だけ（15分で切れる）。
  verify-restaurant-delivery:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'verify-restaurant-delivery' &&
      inputs.environment == 'staging' &&
      github.repository == 'skmtmst/line-harness-oss' &&
      github.ref == 'refs/heads/codex/development'
    environment:
      name: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: verify-staging-restaurant-delivery
      cancel-in-progress: false
    env:
      VERIFY_ENVIRONMENT: staging
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 3画面を実ブラウザで開くので、ここだけ Chromium が要る。
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify the delivery reads and the three screens
        run: |
          set -o pipefail
          pnpm tsx scripts/verification/verify-staging-restaurant-delivery.ts \
            | tee "$RUNNER_TEMP/delivery-verification.json"

      - name: Publish aggregate-only result
        if: always()
        run: |
          {
            echo '## デリバリー受注の確認（検証環境）'
            echo
            if [ -s "$RUNNER_TEMP/delivery-verification.json" ]; then
              echo '```json'
              tail -n 1 "$RUNNER_TEMP/delivery-verification.json"
              echo '```'
            else
              echo '検証結果を生成できませんでした。'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
