name: Musubo service site

on:
  pull_request:
    paths:
      - "sites/musubo/**"
      - ".github/workflows/musubo-site-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: musubo-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.4'
      - name: Test isolated static site
        run: node --test sites/musubo/test/*.test.mjs
      - name: Build review site (never deploy)
        run: node sites/musubo/build.mjs
