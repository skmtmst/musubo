# Validation environment only. Production uses wrangler.toml.
#
# Safety invariants:
# - Uses dedicated D1/R2 resources.
# - Intentionally has no [triggers] section, so scheduled delivery cannot run.
# - LINE credentials must come from a dedicated validation LINE channel.
#   Never copy the production LINE secrets into this Worker.
name = "nen-line-stg"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# global_fetch_strictly_public: subrequest を公開インターネット経路に限定する
# (N-366 の strict-public 保証。外向き Webhook の配送境界の一部)。
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = true
account_id = "55f40f5577bd68828d67716f8d900642"

# 他社向けサービス用の検証APIドメイン。既存の workers.dev URL も併存して使える。
routes = [
  { pattern = "stg-api.musubo.jp", custom_domain = true }
]

# 検証環境だけ、失敗したときのサーバー記録を後から読めるようにする。
# （本番 wrangler.toml には入れない。ここは検証用の設定ファイル。）
[observability]
enabled = true

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nen-line-stg"
database_id = "00bd7aca-950b-4d67-b865-fd7427b9c43f"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nen-line-stg-images"

[[r2_buckets]]
binding = "RAW_MAIL"
bucket_name = "musubo-raw-mail-stg"

[ai]
binding = "AI"

# バナー生成の用途寸法への整形（Cloudflare Images・R120）。
# R2 の `IMAGES` と名前が重なるため `CF_IMAGES` にしている。
# 2026-10-08 利用者承認: staging の既存プラン範囲で Images 画像変換を使用する。
# 購入・プラン変更・本番環境への有効化はこの承認の対象外。
[images]
binding = "CF_IMAGES"

[[queues.producers]]
binding = "CODEX_MENTION_QUEUE"
queue = "nen-codex-mentions-stg"

[[queues.consumers]]
queue = "nen-codex-mentions-stg"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
retry_delay = 60

[vars]
DEPLOY_ENV = "staging"
STRIPE_PRODUCT_MUSUBO_CORE = "prod_Vazw5NlIbx7p4p"
STRIPE_PRODUCT_MUSUBO_OPTIONS = "prod_VazxwxtpbbwBs8"
# Q-75 is opened deliberately by the staging operator; enabling it forces the outbound stop.
STAGING_QA_ENABLED = "false"
STAGING_QA_OUTBOUND_DISABLED = "false"
RESTAURANT_TEST_ENABLED = "true"
GOOGLE_BUSINESS_ENABLED = "true"
RT_DELIVERY_UBEREATS_ENVIRONMENT = "sandbox"
GOOGLE_BUSINESS_OAUTH_CLIENT_ID = "904803281314-ufqj5bmmhqnl9hv58uigo4ct6jvfmdkg.apps.googleusercontent.com"
GOOGLE_BUSINESS_WRITE_ENABLED = "false"
# 通常のGoogle書き込みは止めたまま、承認済みの1アカウントだけ投稿テストを許可する。
# 対象は「然-NEN- TEST」。口コミ返信・店舗情報変更・削除は引き続き停止。
GOOGLE_BUSINESS_POST_TEST_LINE_ACCOUNT_ID = "b9dac3d2-b9a7-44b8-bdcf-6d466fd3fb51"
WORKER_NAME = "nen-line-stg"
ADMIN_PAGES_PROJECT = "nen-line-stg-admin"
LIFF_PAGES_PROJECT = ""
D1_DATABASE_ID = "00bd7aca-950b-4d67-b865-fd7427b9c43f"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
WORKER_PUBLIC_URL = "https://stg-api.musubo.jp"
WORKER_URL = "https://stg-api.musubo.jp"
# 同じ検証Workerに届く別の入口。LINE の Webhook がこちらで登録されていても「この環境」と判定する。
WORKER_ALIAS_URLS = "https://nen-line-stg.skmtmst.workers.dev"
ADMIN_PUBLIC_URL = "https://stg-admin.musubo.jp"
META_GRAPH_API_VERSION = "v24.0"
META_REDIRECT_URI = "https://stg-api.musubo.jp/api/instagram/oauth/callback"
ADMIN_ORIGIN = "https://stg-admin.musubo.jp,https://nen-line-stg-admin.pages.dev"
ADMIN_ALLOW_CROSS_SITE = "true"
LIFF_PUBLIC_URL = "https://stg-api.musubo.jp"
CF_ACCOUNT_ID = "55f40f5577bd68828d67716f8d900642"
MEDIA_R2_BUCKET_NAME = "nen-line-stg-images"
NEN_EC_BASE_URL = "https://stg.nen-petfood.com"
NEN_RICH_MENU_STORE_URL = "https://stg.nen-petfood.com"
CONTACT_EMAIL = "test-shed@stg.nen-petfood.com"
SUPPORT_INBOUND_EMAIL = "test-shed@stg.nen-petfood.com"
XSERVER_RELAY_URL = "https://stg.nen-petfood.com/_system/support-mail-relay.php"
SEARCH_CONSOLE_SITE_URL = "sc-domain:nen-petfood.com"
RESTAURANT_INTAKE_DOMAIN = "rs.musubo.jp"
RAW_MAIL_RETENTION_DAYS = "90"
CODEX_SLACK_USER_ID = "U0BRUBQMV9Q"
CODEX_ALLOWED_TEAM_IDS = "T0BRCRVDDGF"
CODEX_ALLOWED_CHANNEL_IDS = "C0BS5QFJ6LA"
CODEX_ALLOWED_CHANNEL_NAME_PREFIXES = "line-harness-pr-"
CODEX_RELAY_SOURCE_USER_IDS = "U0BSP754G2C"
CODEX_RELAY_ENABLED = "true"
CODEX_AUTO_MERGE_ENABLED = "true"
CODEX_AUTO_MERGE_REPOSITORY = "skmtmst/line-harness-oss"
CODEX_QUEUE_MAX_ATTEMPTS = "5"
CODEX_OFFICIAL_RECEIPT_GRACE_SECONDS = "30"
