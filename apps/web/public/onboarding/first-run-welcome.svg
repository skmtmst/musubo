<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 66">
  <style>
    path { fill: none; stroke: #1d1d1f; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: write 375ms ease-out var(--start) forwards; }
    circle { fill: #087a3e; opacity: 0; animation: tip 375ms linear var(--start); }
    @keyframes write { to { stroke-dashoffset: 0; } }
    @keyframes tip { 1%, 99% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dashoffset: 0; }
      circle { display: none; }
    }
  </style>
